services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studio}
      POSTGRES_DB: ${POSTGRES_DB:-ai_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_studio} -d ${POSTGRES_DB:-ai_studio}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai_studio_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_studio_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Inside the compose network the service names are the host names.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_studio}:${POSTGRES_PASSWORD:-ai_studio}@postgres:5432/${POSTGRES_DB:-ai_studio}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /app/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:8000/static
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # Only used when LLM_PROVIDER != "mock". Left blank by default so the
      # stack runs offline with no key (see docs/TDD.md section 18).
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      MOCK_LLM_FAIL_TIMES: ${MOCK_LLM_FAIL_TIMES:-0}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/migrations:/app/backend/migrations
      - ./prompts:/app/prompts:ro
      - storage_data:/app/storage
    # Run migrations, then serve. Restarting the stack never re-generates assets.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: ai_studio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_REQUEST_ID_HEADER: ${NEXT_PUBLIC_REQUEST_ID_HEADER:-X-Request-ID}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  storage_data:
